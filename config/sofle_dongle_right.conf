# 右半专用配置。ZMK 按 board 名合并：这个文件只对 -b sofle_dongle_right 生效，
# 不会泄漏到 dongle / 左半的构建。
#
# 这里放的是「模块插座上的线接到右板 MCU 的哪只脚」——属于板子，不属于模块。
# 设备树那一半（I2C / LED 的 psels）在 config/sofle_dongle_right.overlay 里。

# =========================================================
# 右座引脚（MODULAR_POINTER_ANALYSIS.md §4.2）
# =========================================================
#
# 小红点：MOTION 中断线 P0.14
CONFIG_TRACKPOINT_MOTION_GPIO_PORT=0
CONFIG_TRACKPOINT_MOTION_GPIO_PIN=14

# 右座的轨迹球/触摸板引脚源码里没有 → 那边保持默认 -1，
# 编 side=right + ball/pad 时驱动会 #error 拒绝。
