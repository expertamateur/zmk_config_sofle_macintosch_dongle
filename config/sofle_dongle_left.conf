# 左半专用配置。ZMK 按 board 名合并：这个文件只对 -b sofle_dongle_left 生效，
# 不会泄漏到 dongle / 右半的构建。
#
# 这里放的是「模块插座上的线接到左板 MCU 的哪只脚」——属于板子，不属于模块，
# 所以轨迹球和触摸板共用同一批值。设备树那一半（I2C / LED 的 psels）在
# config/sofle_dongle_left.overlay 里。

# =========================================================
# 左座引脚（MODULAR_POINTER_ANALYSIS.md §4.1）
# =========================================================
#
# 轨迹球：四根方向线
#   UP P0.05 · LEFT P0.12 · DOWN P1.09 · RIGHT P0.27
CONFIG_BBTRACKBALL_UP_GPIO_PORT=0
CONFIG_BBTRACKBALL_UP_GPIO_PIN=5
CONFIG_BBTRACKBALL_LEFT_GPIO_PORT=0
CONFIG_BBTRACKBALL_LEFT_GPIO_PIN=12
# 四根里只有 DOWN 在 gpio1，其余三根在 gpio0
CONFIG_BBTRACKBALL_DOWN_GPIO_PORT=1
CONFIG_BBTRACKBALL_DOWN_GPIO_PIN=9
CONFIG_BBTRACKBALL_RIGHT_GPIO_PORT=0
CONFIG_BBTRACKBALL_RIGHT_GPIO_PIN=27

# 触摸板：MOTION 中断线（和轨迹球的 UP 是同一根线）
CONFIG_A320_MOTION_GPIO_PORT=0
CONFIG_A320_MOTION_GPIO_PIN=5

# 左座的小红点引脚源码里没有 → 那边保持默认 -1，
# 编 side=left + trackpoint 时驱动会 #error 拒绝。
